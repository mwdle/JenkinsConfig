# Defaults for nested containers created via Jenkins Docker Plugin

[containers]

# Resolve host.containers.internal to the outer Podman host mapping
host_containers_internal_ip = "169.254.1.2"

# Reap orphaned processes inside nested containers
init=true

# Use isolated userspace networking
netns = "pasta"

# Exclude pinp user while retaining a consistent mapping for shared volumes
userns = "nomap"

[network]

# Preserve outer host mapping instead of remapping it to pinp
pasta_options = ["--map-guest-addr", "none"]
